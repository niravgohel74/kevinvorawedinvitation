<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3B3"/>
      <stop offset="50%" stop-color="#C9B38C"/>
      <stop offset="100%" stop-color="#9E814D"/>
    </linearGradient>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2721"/>
      <stop offset="70%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </radialGradient>
  </defs>

  <!-- Outer royal scalloped / beaded ring -->
  <circle cx="32" cy="32" r="30" fill="url(#sealBg)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="1.5 2"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.6"/>

  <!-- Monogram K & M -->
  <text 
    x="32" 
    y="39" 
    text-anchor="middle" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="20" 
    font-weight="normal" 
    letter-spacing="0.5" 
    fill="url(#goldGrad)"
  >
    K&amp;M
  </text>
</svg>
